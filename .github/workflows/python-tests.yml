name: Run tests

on:
  workflow_dispatch:
    inputs:
      MOCK_TEST_SUITE:
        description: Test suite to run
        required: true
        default: tests
        type: choice
        options:
          - tests
          - smoke
          - regression
      ALLURE_JOB_RUN_ID:
        description: ALLURE_JOB_RUN_ID service parameter. Leave blank.
        required: false
      ALLURE_USERNAME:
        description: ALLURE_USERNAME service parameter. Leave blank.
        required: false  

env:
  ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
  ALLURE_JOB_RUN_ID: ${{ inputs.ALLURE_JOB_RUN_ID }}
  ALLURE_ENDPOINT: https://nimaruichi.qameta.in
  ALLURE_PROJECT_ID: 1
  ALLURE_RESULTS: allure-results
  ALLURE_LAUNCH_NAME: TestForJenkins1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install framework dependencies
        run: python -m pip install -r requirements.txt

      - name: Install and configure allurectl
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ env.ALLURE_ENDPOINT }}
          allure-token: ${{ secrets.ALLURE_TOKEN }}
          allure-project-id: ${{ env.ALLURE_PROJECT_ID }}

      - name: Run tests with Allure
        run: |
          TESTS_PATH=tests/${{ inputs.MOCK_TEST_SUITE }}
          if [ "${{ inputs.MOCK_TEST_SUITE }}" = "tests" ]; then TESTS_PATH=tests; fi
          allurectl watch -- python -m pytest "$TESTS_PATH" --alluredir=${{ env.ALLURE_RESULTS }} --clean-alluredir

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: ${{ env.ALLURE_RESULTS }}
          retention-days: 1
